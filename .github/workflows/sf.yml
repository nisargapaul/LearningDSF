name: SF numerics
on:
  push:
    branches: [main]
    paths: ['sf/**', '.github/workflows/sf.yml']
  pull_request:
    paths: ['sf/**', '.github/workflows/sf.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            sf/requirements.txt
            sf/angular/requirements.txt
      - run: python -m pip install -r sf/angular/requirements.txt
      - run: python sf/run.py plot
      - run: python sf/angular/run.py check
      - run: python sf/angular/run.py plot
