name: HT benchmark

on:
  push:
    branches: [main]
    paths:
      - 'ht/**'
      - '.github/workflows/ht.yml'
  pull_request:
    paths:
      - 'ht/**'
      - '.github/workflows/ht.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ht-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Python benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ht/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r ht/requirements.txt
      - name: Check data and numerical tests
        run: python ht/run.py check
      - name: Render saved benchmark figure
        run: python ht/run.py plot

  three-body:
    name: Three-body algebra and roots
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      JULIA_NUM_PRECOMPILE_TASKS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2
        with:
          version: '1.11.1'
      - name: Install pinned dependencies
        run: julia --project=ht -e 'using Pkg; Pkg.instantiate()'
      - name: Check symbolic moments and numerical setup
        run: julia --threads=1 --project=ht ht/three_body.jl check
      - name: Check dependency lock
        run: git diff --exit-code -- ht/Project.toml ht/Manifest.toml
